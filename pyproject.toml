[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household-core"
version = "0.1.0"
description = "Simulator-agnostic planner protocol and WebSocket serving for Household."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["protocol", "observation", "rerun_sink"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["serving*", "planner*"]
